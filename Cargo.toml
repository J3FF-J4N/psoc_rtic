[package]
authors = ["Jeff <jefferson.janisch@gmail.com>"]
edition = "2018"
readme = "README.md"
name = "psoc6"
version = "0.1.0"

[toolchain]
#channel = "nightly-2020-07-10"
#components = [ "rustfmt", "rustc-dev" ]
targets = [ "thumbv6m-none-eabi", "thumbv7em-none-eabihf" ]
#profile = "minimal"

[dependencies]
psoc6-pac = { path = "psoc6-pac" , version =  "0.0.1" }
psoc6-hal = { path = "psoc6-hal" , version =  "0.1.0" }
cortex-m = "0.6.0"
cortex-m-rt = "0.6.10"
cortex-m-semihosting = "0.3.3"
panic-halt = "0.2.0"


[[example]]
name = "blinky"
path = "examples/blinky.rs"
crate-type = ["bin"]

# this lets you use `cargo fix`!
[[bin]]
name = "psoc6"
test = false
bench = false

[profile.release]
codegen-units = 1 # better optimizations
debug = true # symbols are nice and they don't increase the size on Flash
lto = true # better optimizations
